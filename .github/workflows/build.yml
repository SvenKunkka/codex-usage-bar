name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run parser self-test
        run: ./scripts/test.sh
      - name: Verify app bundle
        run: codesign --verify --deep --strict "dist/Codex Usage Bar.app"
